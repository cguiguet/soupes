<style>

}

/* ---------- background layers ---------- */

.sheet-grab { flex: none; height: 30px; display: grid; place-items: center; cursor: grab; touch-action: none; }

.eyebrow { font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.r-title { font-family: 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-weight: 800; font-size: clamp(40px, 11.5vw, 58px); line-height: .94; letter-spacing: -.04em; margin: 10px 40px 8px 0; }

.r-stats { display: grid; grid-template-columns: 1fr 1fr 1.45fr; gap: 8px; margin: 20px 0 4px; }

.serves button:active { transform: scale(.82); }

.r-sec h3 { font-family: 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1; font-size: 26px; font-weight: 750; letter-spacing: -.02em; margin: 28px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.r-sec h3 small { font-family: 'Instrument Sans', sans-serif; font-size: 12px; font-weight: 600; opacity: .6; letter-spacing: 0; }
.progress { height: 6px; background: rgba(43, 22, 8, .08); border-radius: 9px; overflow: hidden; margin-bottom: 12px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 9px; transition: width .6s cubic-bezier(.2, 1.2, .3, 1); }
.ings { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ing {
  width: 100%; display: grid; grid-template-columns: 24px 28px auto 1fr; align-items: center; gap: 10px; text-align: left;
  padding: 11px 12px; border-radius: 16px; background: #fff; transition: background .3s, transform .18s; font-size: 15px;
}
.ing:active { transform: scale(.975); }
.ing .box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid rgba(43, 22, 8, .2); display: grid; place-items: center; transition: background .25s, border-color .25s, transform .4s cubic-bezier(.3, 1.8, .5, 1); }
.ing .box svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .35s .08s; }
.ing.on { background: color-mix(in srgb, var(--accent) 9%, #fff); }
.ing.on .box { background: var(--accent); border-color: var(--accent); transform: rotate(-8deg) scale(1.08); }
.ing.on .box svg { stroke-dashoffset: 0; }
.ing .e { font-size: 22px; line-height: 1; text-align: center; }
.ing .q { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; transition: opacity .3s; }
.ing .n { position: relative; transition: opacity .3s; line-height: 1.25; }
.ing .n::after { content: ''; position: absolute; left: 0; top: 52%; height: 2px; width: 0; background: currentColor; border-radius: 2px; transition: width .4s cubic-bezier(.6, 0, .2, 1); }
.ing.on .n::after { width: 100%; }
.ing.on .n, .ing.on .q { opacity: .42; }
.mini { font-size: 12.5px; opacity: .6; margin-top: 10px; text-align: center; font-weight: 500; }
.steps { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: 42px 1fr; gap: 10px; padding: 15px 15px 15px 12px; border-radius: 20px; background: #fff; cursor: pointer; transition: opacity .35s, transform .2s; }
.step:active { transform: scale(.985); }
.step .sn { font-family: 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-size: 38px; font-weight: 800; line-height: .9; color: var(--accent); text-align: center; position: relative; }
.step.done { opacity: .45; }

.step p { font-size: 16px; line-height: 1.45; }
.tmr { margin-top: 10px; display: inline-flex; gap: 6px; align-items: center; padding: 8px 13px; border-radius: 99px; background: color-mix(in srgb, var(--accent) 15%, #fff); font-weight: 700; font-size: 13px; transition: transform .2s; }
.tmr:active { transform: scale(.93); }
.tip { margin-top: 44px; position: relative; padding: 22px 18px 20px; border-radius: 24px; background: var(--ink); color: #fff6ea; }
.tip .badge { position: absolute; top: -34px; right: 12px; width: 84px; height: 84px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.tip .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 12s linear infinite; }
.tip .badge text { font-family: 'Instrument Sans', sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: .18em; fill: #fff; text-transform: uppercase; }

.r-end { text-align: center; font-family: 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1; font-style: italic; font-weight: 600; font-size: 30px; margin: 40px 0 6px; }

.timer {
  position: fixed; z-index: 9; top: calc(env(safe-area-inset-top) + 12px); left: 50%; transform: translate(-50%, -160%);
  display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 8px; border-radius: 99px; background: var(--ink); color: #fff6ea;
  box-shadow: 0 16px 40px -14px rgba(0, 0, 0, .55); transition: transform .6s cubic-bezier(.2, 1.4, .3, 1); cursor: pointer;

@keyframes shake { 0%, 100% { margin-left: 0; } 25% { margin-left: -6px; } 75% { margin-left: 6px; } }

/* ---------- intro ---------- */
.intro {
  position: fixed; inset: 0; z-index: 20; background: #2a1205; color: #fff1dc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  clip-path: inset(0 0 0% 0);
}
.intro h1 { font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; font-weight: 800; font-size: clamp(72px, 22vw, 170px); letter-spacing: -.045em; display: flex; line-height: 1; }
.intro h1 span { display: inline-block; animation: wave 1.3s ease-in-out infinite; animation-delay: calc(var(--i) * .09s); }

@keyframes wave { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-16px) rotate(-4deg); } }

@keyframes rise { 0% { transform: translateY(14px) scaleY(.4); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-14px) scaleY(1) skewX(14deg); opacity: 0; } }

    g.gain.exponentialRampToValueAtTime(.16, t + .14);
    g.gain.exponentialRampToValueAtTime(.0001, t + .75);

  uColor: { value: new THREE.Color(SOUPS[0].gl.color) }, uCream: { value: new THREE.Color(SOUPS[0].gl.cream) },

    uniform float uTime; uniform vec4 uRipples[${RIPPLE_N}]; uniform float uSwirl; uniform float uRadius;

    float height(vec2 p){

      v -= uSwirl*.16*exp(-r*r*1.6);

    uniform float uTime, uRadius, uSpin, uTwist, uCreamAmt, uOilAmt, uSpeckAmt, uPourAmt, uPourR;
    uniform vec3 uColor, uCream, uOil, uSpeck, uPourCol; uniform vec2 uPourPos;
    varying vec3 vWorld; varying vec3 vN; varying vec2 vP;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);

      vec3 col = uColor*(.84 + .3*n);

      #include <tonemapping_fragment>

/* ---------- liquides versés ---------- */
const pours = [];
function pour(hex) {
  const col = new THREE.Color(hex);
  const x = rand(-.45, .45), z = rand(-.35, .35);
  pours.push({ x, z, col, t: 0, dur: .9 });
  Sound.pour();
  soupU.uPourPos.value.set(x, z);
  soupU.uPourCol.value.copy(col);
  gsap.killTweensOf(soupU.uPourAmt); gsap.killTweensOf(soupU.uPourR);
  gsap.timeline()
    .set(soupU.uPourAmt, { value: 0 })
    .to(soupU.uPourAmt, { value: .85, duration: .8, ease: 'power2.out', delay: .5 })
    .to(soupU.uPourAmt, { value: 0, duration: 2.6, ease: 'power1.inOut', delay: .3 });
  gsap.fromTo(soupU.uPourR, { value: .08 }, { value: .95, duration: 3.6, ease: 'power2.out', delay: .5 });
}

/* ---------- ondes ---------- */
let elapsed = 0;
function addRipple(x, z, s) {
  ripples[rippleIdx].set(x, z, elapsed, s);
  rippleIdx = (rippleIdx + 1) % RIPPLE_N;
}
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpC = new THREE.Color(), WHITE = new THREE.Color(1, 1, 1);
function splash(x, z, n, strength) {
  tmpC.copy(soupU.uColor.value).lerp(WHITE, .12);
  for (let i = 0; i < n; i++) {
    const a = rand(TAU), sp = rand(.25, .85) * strength;
    tmpV.set(x, SOUP_Y + .02, z);
    tmpV2.set(Math.cos(a) * sp, rand(1.1, 2.3) * strength, Math.sin(a) * sp);
    emitDrop(tmpV, tmpV2, rand(.018, .038), tmpC, 0);
  }
}

/* =====================================================================
   CAMÉRA & CADRAGE
   ===================================================================== */
const view = { x: 0, y: .14, zoom: 1 };
const camBase = new THREE.Vector3();
const target = new THREE.Vector3(0, .78, 0);
const camDir = new THREE.Vector3(0, Math.sin(THREE.MathUtils.degToRad(38)), Math.cos(THREE.MathUtils.degToRad(38)));
function frame() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 1 ? 42 : 34;
  const vf = THREE.MathUtils.degToRad(camera.fov);
  const tv = Math.tan(vf / 2), th = tv * camera.aspect;
  const dW = (3.5 / .86) / (2 * th);
  const dH = (2.7 / .44) / (2 * tv);
  camBase.copy(target).addScaledVector(camDir, Math.max(dW, dH));
  camera.position.copy(camBase);
}
frame();
addEventListener('resize', () => { frame(); layoutCards(); });

/* parallaxe : souris ou gyroscope */
const par = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  par.tx = (e.clientX / innerWidth - .5) * 2; par.ty = (e.clientY / innerHeight - .5) * 2;
});
let gyroAsked = false;
function askGyro() {
  if (gyroAsked) return; gyroAsked = true;
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') DOE.requestPermission().catch(() => {});
}
addEventListener('deviceorientation', (e) => {
  if (e.gamma == null) return;
  par.tx = clamp(e.gamma / 25, -1, 1); par.ty = clamp((e.beta - 50) / 30, -1, 1);
});

/* =====================================================================
   TOUILLER / TAPER
   ===================================================================== */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
function soupPoint(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  bowlGroup.updateMatrixWorld();
  plane.constant = -(bowlGroup.position.y + SOUP_Y);
  if (!ray.ray.intersectPlane(plane, hit)) return null;
  return bowlGroup.worldToLocal(hit.clone());
}
let swirl = 0, vortex = 0;
const stir = { on: false, x: 0, y: 0, t: 0, moved: false, lastA: null, lastR: null, inside: false };
const spoonTarget = new THREE.Vector3(0, SOUP_Y - .03, 0);
let spoonShown = false;
function showSpoon(v) {
  if (v === spoonShown) return; spoonShown = v;
  gsap.to(spoon.scale, { x: v ? 1 : 0, y: v ? 1 : 0, z: v ? 1 : 0, duration: v ? .45 : .3, ease: v ? 'back.out(2)' : 'power2.in' });
}
canvas.addEventListener('pointerdown', (e) => {
  Sound.init(); askGyro();
  if (sheetOpen) return;
  stir.on = true; stir.x = e.clientX; stir.y = e.clientY; stir.t = performance.now(); stir.moved = false; stir.lastA = null; stir.lastR = null;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  const p = soupPoint(e);
  if (p && Math.hypot(p.x, p.z) < SOUP_R + .2) {
    stir.inside = true;
    spoonTarget.set(p.x, SOUP_Y - .03, p.z);
    spoon.position.copy(spoonTarget);
  } else stir.inside = false;
});
canvas.addEventListener('pointermove', (e) => {
  if (!stir.on) return;
  if (Math.hypot(e.clientX - stir.x, e.clientY - stir.y) > 9) stir.moved = true;
  if (!stir.moved) return;
  const p = soupPoint(e);
  if (!p) return;
  const r = Math.hypot(p.x, p.z), lim = SOUP_R - .3;
  if (r > SOUP_R + .6) return;
  if (r > lim) { p.x *= lim / r; p.z *= lim / r; }
  showSpoon(true); hideHint();
  spoonTarget.set(p.x, SOUP_Y - .03, p.z);
  const a = Math.atan2(p.z, p.x);
  if (stir.lastA != null) {
    let dA = a - stir.lastA;
    if (dA > Math.PI) dA -= TAU; if (dA < -Math.PI) dA += TAU;
    swirl = clamp(swirl + dA * 2.4, -5, 5);
  }
  stir.lastA = a;
  if (!stir.lastR || Math.hypot(p.x - stir.lastR.x, p.z - stir.lastR.z) > .2) {
    addRipple(p.x, p.z, .4);
    stir.lastR = { x: p.x, z: p.z };
  }
});
function endStir(e) {
  if (!stir.on) return;
  stir.on = false; showSpoon(false);
  if (!stir.moved && performance.now() - stir.t < 400) {
    const p = soupPoint(e);
    const inside = p && Math.hypot(p.x, p.z) < SOUP_R;
    spawnOne(pick(SOUPS[cur].rain), inside ? { x: p.x, z: p.z } : null);
    hideHint();
  }
}
canvas.addEventListener('pointerup', endStir);
canvas.addEventListener('pointercancel', endStir);

/* =====================================================================
   BOUCLE
   ===================================================================== */
const clock = new THREE.Clock();
let lastFrameTime = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), .05);
  elapsed += dt;
  const t = elapsed;

  // tourbillon
  swirl *= Math.exp(-dt * .7);
  vortex += (Math.min(Math.abs(swirl) / 4, 1) - vortex) * Math.min(1, dt * 3);
  soupU.uTime.value = t;
  soupU.uSwirl.value = vortex;
  soupU.uSpin.value += (.06 + swirl * .85) * dt;
  soupU.uTwist.value += (swirl * .7 - soupU.uTwist.value) * Math.min(1, dt * 1.5);
  steamMat.uniforms.uTime.value = t;

  // ingrédients
  const floating = [];
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i], o = it.o;
    if (it.state === 0) {
      it.vy -= 7 * dt;
      o.position.y += it.vy * dt;
      o.rotation.x += it.spin.x * dt; o.rotation.y += it.spin.y * dt; o.rotation.z += it.spin.z * dt;
      if (o.position.y <= SOUP_Y) {
        it.state = 1;
        const s = clamp(-it.vy / 5, .3, 1);
        it.dip = Math.min(.16, -it.vy * .03);
        addRipple(o.position.x, o.position.z, s * (it.size > .1 ? 1 : .55));
        splash(o.position.x, o.position.z, Math.round(4 + it.size * 40), it.size > .1 ? 1 : .7);
        Sound.plop(clamp(1.6 - it.size * 4, .9, 2.4) * rand(.92, 1.08), it.size > .1 ? .22 : .1);
        o.rotation.x %= TAU; o.rotation.z %= TAU;
      }
      continue;
    }
    // flotte en orbite avec le tourbillon
    let x = o.position.x, z = o.position.z;
    let r = Math.hypot(x, z), a = Math.atan2(z, x);
    const w = .07 + swirl * (1.15 - .55 * r / SOUP_R);
    a += w * dt;
    r += Math.sin(t * .4 + it.phase) * .03 * dt;
    r = clamp(r, .08, SOUP_R - it.size - .14);
    o.position.x = Math.cos(a) * r; o.position.z = Math.sin(a) * r;
    it.dip *= Math.exp(-dt * 2.6);
    o.rotation.y += w * dt;
    if (it.state === 1) {
      o.position.y = SOUP_Y - .02 + Math.sin(t * 2.1 + it.phase) * .012 - it.dip - vortex * .16 * Math.exp(-r * r * 1.6);
      const k = Math.min(1, dt * 2.5);
      o.rotation.x += (it.rest.x - o.rotation.x) * k;
      o.rotation.z += (it.rest.z - o.rotation.z) * k;
      floating.push(it);
    } else {
      o.position.y -= dt * .3;
      o.scale.multiplyScalar(1 - dt * 1.3);
      if (o.scale.x < .05) { bowlGroup.remove(o); items.splice(i, 1); }
    }
  }
  // les ingrédients se poussent un peu
  for (let i = 0; i < floating.length; i++) {
    const a = floating[i].o.position;
    for (let j = i + 1; j < floating.length; j++) {
      const b = floating[j].o.position;
      const dx = b.x - a.x, dz = b.z - a.z, min = (floating[i].size + floating[j].size) * .85;
      const d2 = dx * dx + dz * dz;
      if (d2 < min * min && d2 > 1e-6) {
        const d = Math.sqrt(d2), push = (min - d) * .5 * Math.min(1, dt * 8) / d;
        a.x -= dx * push; a.z -= dz * push; b.x += dx * push; b.z += dz * push;
      }
    }
  }

  // liquides qui coulent
  for (let i = pours.length - 1; i >= 0; i--) {
    const p = pours[i];
    p.t += dt;
    if (p.t > p.dur) { pours.splice(i, 1); continue; }
    for (let k = 0; k < 3; k++) {
      tmpV.set(p.x + rand(-.05, .05), SOUP_Y + 2.5, p.z + rand(-.05, .05));
      tmpV2.set(rand(-.08, .08), -2.6, rand(-.08, .08));
      emitDrop(tmpV, tmpV2, rand(.028, .048), p.col, 1);
    }
  }

  // gouttes
  for (let i = 0; i < DROP_N; i++) {
    const d = drops[i];
    if (!d.on) continue;
    d.v.y -= 9 * dt;
    d.p.addScaledVector(d.v, dt);
    if (d.v.y < 0 && d.p.y < SOUP_Y) {
      d.on = false;
      if (d.kind === 1 && Math.random() < .3) addRipple(d.p.x, d.p.z, .22);
      dummy.scale.setScalar(0);
    } else {
      dummy.position.copy(d.p);
      const st = d.kind === 1 ? 1.8 : 1 + Math.min(.6, Math.abs(d.v.y) * .12);
      dummy.scale.set(d.s, d.s * st, d.s);
    }
    dummy.updateMatrix();
    dropMesh.setMatrixAt(i, dummy.matrix);
  }
  dropMesh.instanceMatrix.needsUpdate = true;

  // bulles
  if (t > nextBubble) {
    nextBubble = t + rand(.25, .9);
    const b = bubbles.find((b) => !b.on);
    if (b) {
      const a = rand(TAU), r = Math.sqrt(Math.random()) * (SOUP_R - .3);
      Object.assign(b, { on: true, t: 0, life: rand(.5, 1.1), s: rand(.025, .06) });
      b.m.position.set(Math.cos(a) * r, SOUP_Y, Math.sin(a) * r);
    }
  }
  for (const b of bubbles) {
    if (!b.on) continue;
    b.t += dt;
    const k = b.t / b.life;
    if (k >= 1) {
      b.on = false; b.m.scale.setScalar(0);
      addRipple(b.m.position.x, b.m.position.z, .16);
      Sound.plop(rand(2, 3), .025);
    } else {
      b.m.scale.setScalar(b.s * Math.min(1, k * 1.5));
      b.m.position.y = SOUP_Y - b.s * .35;
    }
  }

  // cuillère
  spoon.position.lerp(spoonTarget, Math.min(1, dt * 14));
  spoon.rotation.y = 0;
  spoon.rotation.x = .38 + par.y * .05;
  spoon.rotation.z = -spoon.position.x * .22;

  // ombre qui suit le bol
  const hgt = bowlGroup.position.y;
  shadow.scale.setScalar(1 / (1 + Math.max(0, hgt) * .25));
  shadow.material.opacity = clamp(1 - hgt * .25, .2, 1);
  shadow.position.x = bowlGroup.position.x;

  // caméra
  par.x += (par.tx - par.x) * Math.min(1, dt * 3);
  par.y += (par.ty - par.y) * Math.min(1, dt * 3);
  camera.position.copy(camBase);
  const dist = camBase.distanceTo(target);
  camera.position.x += par.x * dist * .06 + Math.sin(t * .25) * dist * .012;
  camera.position.y += -par.y * dist * .035;
  camera.lookAt(target);
  camera.zoom = view.zoom;
  camera.setViewOffset(innerWidth, innerHeight, view.x * innerWidth, view.y * innerHeight, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  steamMat.uniforms.uScale.value = (innerHeight * renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)) * view.zoom;

  renderer.render(scene, camera);
  lastFrameTime = t;
}

const cardsEl = $('#cards'), dotsEl = $('#dots');
cardsEl.innerHTML = SOUPS.map((s, i) => `

    <span class="blob"></span>
    <span class="emo">${s.emo.map((e, k) => `<span style="--d:${k * .6}">${e}</span>`).join('')}</span>
    <div class="num">N° 0${i + 1} — ${s.season}</div>
    <h2>${s.name}</h2>
    <p class="sub">${s.sub}</p>
    <div class="chips"><span>⏱ ${s.time} min</span><span>${s.level}</span><span>${s.serves} pers.</span></div>
    <button class="open" data-i="${i}">Ouvrir la recette <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </article>`).join('');
dotsEl.innerHTML = SOUPS.map(() => '<i></i>').join('');
const cardEls = $$('.card', cardsEl), dotEls = $$('i', dotsEl);
let shown = 0, cur = -1, scrollRaf = 0, settleT = 0;
function layoutCards() {
  const c = cardsEl.scrollLeft + cardsEl.clientWidth / 2;
  let best = 0, bd = 1e9;
  cardEls.forEach((el, i) => {
    const off = (el.offsetLeft + el.offsetWidth / 2 - c) / el.offsetWidth;
    const a = Math.min(Math.abs(off), 1.5);
    el.style.transform = `translateY(${a * 18}px) rotate(${off * 5}deg) scale(${1 - a * .08})`;
    el.style.opacity = 1 - a * .3;
    if (Math.abs(off) < bd) { bd = Math.abs(off); best = i; }
  });
  if (best !== shown) {
    shown = best;
    dotEls.forEach((d, i) => d.classList.toggle('on', i === shown));
    Sound.tick();
  }
  clearTimeout(settleT);
  settleT = setTimeout(() => setSoup(shown), 140);
}
cardsEl.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; layoutCards(); });
}, { passive: true });
function scrollToCard(i, smooth = true) {
  const el = cardEls[i];
  cardsEl.scrollTo({ left: el.offsetLeft + el.offsetWidth / 2 - cardsEl.clientWidth / 2, behavior: smooth ? 'smooth' : 'auto' });
}
cardsEl.addEventListener('click', (e) => {
  Sound.init();
  const card = e.target.closest('.card');
  if (!card) return;
  const i = +card.dataset.i;
  if (e.target.closest('.open') || i === shown) {
    if (i !== shown) scrollToCard(i);
    setSoup(i);
    openSheet(i);
  } else scrollToCard(i);
});

const root = document.documentElement;
const metaTheme = $('meta[name="theme-color"]');
function setMarquee(s) {
  $$('.m1 span').forEach((el) => (el.textContent = `${s.short} ✦ `.repeat(6)));
  $$('.m2 span').forEach((el) => (el.textContent = `${s.season} · ${s.time} min · ${s.level} · `.repeat(6)));
}
function tweenColor(c, hex, d = 1.2) {
  const to = new THREE.Color(hex);
  gsap.to(c, { r: to.r, g: to.g, b: to.b, duration: d, ease: 'power2.inOut' });
}
function setSoup(i, first = false) {
  if (i === cur) return;
  cur = i;
  const s = SOUPS[i];
  Object.entries(s.theme).forEach(([k, v]) => root.style.setProperty('--' + k, v));
  metaTheme.setAttribute('content', s.theme.bg2);

    opacity: 0, duration: .3, onComplete: () => { setMarquee(s); gsap.to('.marquee', { opacity: 1, duration: .6 }); },
  });

  gsap.to(soupU.uOilAmt, { value: s.gl.oilAmt, duration: 1.2 });
  gsap.to(soupU.uSpeckAmt, { value: s.gl.speckAmt, duration: 1.2 });
  items.forEach((it) => { if (it.state === 1) it.state = 2; else if (it.state === 0) it.state = 2; });
  timers.forEach(clearTimeout); timers.clear();
  swirl += 2.6;
  hop();
  Sound.whoosh();
  steamBurst(1.8);
  later(() => rain(reduced ? 6 : 12), 420);
  if (sheetOpen) renderSheet();
}
function rain(n) {
  const s = SOUPS[cur];
  for (let k = 0; k < n; k++) later(() => spawnOne(pick(s.rain)), k * 110 + rand(60));
}
function hop(big = false) {
  gsap.killTweensOf(bowlGroup.position); gsap.killTweensOf(bowlGroup.rotation); gsap.killTweensOf(bowlGroup.scale);
  gsap.timeline()
    .to(bowlGroup.scale, { x: 1.06, y: .9, z: 1.06, duration: .12, ease: 'power2.out' })
    .to(bowlGroup.position, { y: big ? .8 : .45, duration: .28, ease: 'power2.out' })
    .to(bowlGroup.scale, { x: .96, y: 1.06, z: .96, duration: .28 }, '<')
    .to(bowlGroup.position, { y: 0, duration: .7, ease: 'bounce.out' })
    .to(bowlGroup.scale, { x: 1, y: 1, z: 1, duration: .5, ease: 'elastic.out(1, .4)' }, '<.15');
  gsap.to(bowlGroup.rotation, { y: '+=' + TAU / 3, duration: 1.2, ease: 'power3.inOut' });
}
function steamBurst(k = 2.5) {
  gsap.fromTo(steamMat.uniforms.uIntensity, { value: k }, { value: 1, duration: 2.4, ease: 'power2.out' });
}

}
function updateQuantities(anim = true) {
  const s = SOUPS[cur];
  $$('.ing', sheetScroll).forEach((el) => {
    const ing = s.ingredients[+el.dataset.k];
    const q = ing.q == null ? null : ing.q * serves / s.serves;
    $('.q', el).textContent = fmtQty(q, ing.u);
    $('.n', el).textContent = fmtName(ing, q);
  });
  $('#servesN').textContent = serves;
  if (anim) {
    gsap.fromTo($$('.ing .q', sheetScroll), { scale: 1.35, color: s.theme.accent }, { scale: 1, color: 'inherit', duration: .5, stagger: .02, ease: 'back.out(3)', clearProps: 'color' });
    gsap.fromTo('#servesN', { y: -8, scale: 1.4 }, { y: 0, scale: 1, duration: .45, ease: 'back.out(3)' });
  }
}
function updateProgress() {
  const n = SOUPS[cur].ingredients.length;
  $('#count').textContent = `${checked.size}/${n} dans la marmite`;
  $('#prog').style.width = (checked.size / n * 100) + '%';
}
sheetScroll.addEventListener('click', (e) => {
  Sound.init();
  const s = SOUPS[cur];
  const sv = e.target.closest('.serves button');
  if (sv) { serves = clamp(serves + +sv.dataset.d, 1, 12); updateQuantities(); Sound.tick(); return; }
  const ing = e.target.closest('.ing');
  if (ing) {
    const k = +ing.dataset.k;
    if (checked.has(k)) { checked.delete(k); ing.classList.remove('on'); Sound.tick(); }
    else {
      checked.add(k); ing.classList.add('on');
      spawn(s.ingredients[k].s);
      buzz(12);
      gsap.fromTo($('.e', ing), { y: 0, scale: 1 }, { keyframes: [{ y: -14, scale: 1.4, rotation: -15, duration: .18 }, { y: 0, scale: 1, rotation: 0, duration: .4, ease: 'bounce.out' }] });
      if (checked.size === s.ingredients.length) later(celebrate, 900);
    }
    updateProgress();
    return;
  }
  const tmr = e.target.closest('.tmr');
  if (tmr) { startTimer(+tmr.dataset.min, tmr.dataset.label); return; }
  const step = e.target.closest('.step');
  if (step) {
    const k = +step.dataset.k;
    stepsDone.has(k) ? stepsDone.delete(k) : stepsDone.add(k);
    step.classList.toggle('done');
    Sound.tick();
    if (stepsDone.size === s.steps.length) { swirl += 3; steamBurst(); toast('Toutes les étapes sont faites. À table ! 🥄'); }
  }
});

function openSheet(i) {
  if (sheetOpen) return;
  sheetOpen = true;
  renderSheet();
  sheetScroll.scrollTop = 0;
  ui.classList.add('sheet-open');
  backdrop.classList.add('on');
  sheet.style.visibility = 'visible';
  const d = isDesk();
  gsap.killTweensOf(sheet);
  gsap.fromTo(sheet, { x: 0, y: 0, xPercent: d ? 120 : 0, yPercent: d ? 0 : 110 }, { x: 0, y: 0, xPercent: 0, yPercent: 0, duration: .8, ease: 'expo.out' });
  gsap.from($$('.r-title .ch', sheetScroll), { yPercent: 110, opacity: 0, rotation: () => rand(-25, 25), duration: .7, stagger: .022, ease: 'back.out(2)', delay: .15 });
  gsap.from($$('.eyebrow, .r-sub, .stat', sheetScroll), { y: 20, opacity: 0, duration: .6, stagger: .06, ease: 'power3.out', delay: .25 });
  gsap.from($$('.ings li', sheetScroll), { x: 30, opacity: 0, duration: .5, stagger: .035, ease: 'power3.out', delay: .4 });
  gsap.to(view, d ? { x: .17, y: .06, zoom: 1, duration: 1, ease: 'expo.inOut' } : { x: 0, y: .385, zoom: .5, duration: 1, ease: 'expo.inOut' });
  history.pushState({ sheet: true }, '');
  navigator.wakeLock?.request('screen').then((w) => (wakeLock = w)).catch(() => {});
  Sound.whoosh();
}
function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  ui.classList.remove('sheet-open');
  backdrop.classList.remove('on');
  const d = isDesk();
  gsap.killTweensOf(sheet);
  gsap.to(sheet, { ...(d ? { xPercent: 120 } : { yPercent: 110 }), duration: .5, ease: 'power3.in', onComplete: () => { sheet.style.visibility = 'hidden'; } });
  gsap.to(view, { x: 0, y: d ? .1 : .14, zoom: 1, duration: .9, ease: 'expo.inOut' });
  wakeLock?.release().catch(() => {}); wakeLock = null;
  if (history.state?.sheet) history.back();
}
addEventListener('popstate', () => { if (sheetOpen) closeSheet(); });
$('#close').addEventListener('click', closeSheet);
backdrop.addEventListener('click', closeSheet);

/* glisser la poignée pour fermer */
{
  const grab = $('#grab');
  let y0 = null, dy = 0;
  grab.addEventListener('pointerdown', (e) => { if (isDesk()) return; y0 = e.clientY; dy = 0; grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove', (e) => {
    if (y0 == null) return;
    dy = Math.max(0, e.clientY - y0);
    gsap.set(sheet, { y: dy });
  });
  const end = () => {
    if (y0 == null) return;
    y0 = null;
    if (dy > 110) closeSheet();
    else gsap.to(sheet, { y: 0, duration: .5, ease: 'back.out(2)' });
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
}

/* =====================================================================
   MINUTEUR
   ===================================================================== */
const timerEl = $('#timer'), tlEl = $('#tl'), tnEl = $('#tn'), ringFg = $('#ringFg');
const RING_C = 75.4;
const T = { end: 0, total: 1, iv: 0 };
function startTimer(min, label) {
  Sound.init();
  T.total = min * 60000; T.end = Date.now() + T.total;
  tnEl.textContent = label;
  timerEl.classList.remove('done'); timerEl.classList.add('on');
  clearInterval(T.iv); T.iv = setInterval(tickTimer, 250); tickTimer();
  toast(`⏱ Minuteur « ${label} » : ${min} min`);
  Sound.tick();
}
function tickTimer() {
  const left = Math.max(0, T.end - Date.now());
  const s = Math.ceil(left / 1000);
  tlEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  ringFg.style.strokeDashoffset = RING_C * (1 - left / T.total);
  if (left <= 0) {
    clearInterval(T.iv);
    timerEl.classList.add('done');
    tlEl.textContent = "C'est prêt !";
    Sound.ding(); buzz([220, 100, 220, 100, 500]);
    steamBurst(3); hop();
  }
}
timerEl.addEventListener('click', () => { clearInterval(T.iv); timerEl.classList.remove('on', 'done'); });

/* =====================================================================
   PETITS PLAISIRS
   ===================================================================== */
const toastEl = $('#toast');
function toast(msg) {
  toastEl.textContent = msg;
  gsap.killTweensOf(toastEl);
  gsap.timeline()
    .fromTo(toastEl, { y: 30, opacity: 0, xPercent: -50, x: 0 }, { y: 0, opacity: 1, duration: .5, ease: 'back.out(2)' })
    .to(toastEl, { opacity: 0, y: 16, duration: .4, delay: 2.4 });
}
toastEl.style.transform = 'none';
function bowlScreen() {
  const v = new THREE.Vector3(0, SOUP_Y, 0).applyMatrix4(bowlGroup.matrixWorld).project(camera);
  return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight };
}
function burst(emojis, n = 26) {
  const { x, y } = bowlScreen();
  for (let i = 0; i < n; i++) {
    const el = document.createElement('span');
    el.className = 'burst'; el.textContent = pick(emojis);
    document.body.appendChild(el);
    const ang = rand(-Math.PI * .92, -Math.PI * .08), sp = rand(160, 420);
    gsap.set(el, { x, y, xPercent: -50, yPercent: -50, scale: rand(.6, 1.4), rotation: rand(-40, 40) });
    gsap.to(el, { x: x + Math.cos(ang) * sp * 1.3, duration: 1.7, ease: 'power1.out' });
    gsap.to(el, { y: y + Math.sin(ang) * sp, duration: .55, ease: 'power2.out' });
    gsap.to(el, { y: innerHeight + 80, duration: 1.1, delay: .55, ease: 'power2.in', onComplete: () => el.remove() });
    gsap.to(el, { rotation: '+=' + rand(-360, 360), duration: 1.7 });
  }
}
function celebrate() {
  const s = SOUPS[cur];
  burst([...s.emo, ...s.ingredients.map((i) => i.e), '✨', '🥄']);
  steamBurst(3.2); hop(true); swirl += 4;
  Sound.ding(); buzz([30, 60, 30]);
  toast('Tout est dans la marmite. Bon appétit ! 🍲');
}

$('#dice').addEventListener('click', () => {
  Sound.init();
  let i; do { i = Math.floor(Math.random() * SOUPS.length); } while (i === shown && SOUPS.length > 1);
  gsap.fromTo('#dice svg', { rotation: 0 }, { rotation: 720, duration: .8, ease: 'power3.out' });
  scrollToCard(i);
  if (sheetOpen) setSoup(i);
});
const soundBtn = $('#sound');
function paintSound() {
  $('.on-ic', soundBtn).style.display = Sound.on ? '' : 'none';
  $('.off-ic', soundBtn).style.display = Sound.on ? 'none' : '';
}
paintSound();
soundBtn.addEventListener('click', () => {
  Sound.on = !Sound.on;
  localStorage.setItem('soupes-sound', Sound.on ? 'on' : 'off');
  Sound.init(); paintSound();
  if (Sound.on) Sound.plop(1.4, .25);
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
  if (sheetOpen) return;
  if (e.key === 'ArrowRight') scrollToCard(Math.min(SOUPS.length - 1, shown + 1));
  if (e.key === 'ArrowLeft') scrollToCard(Math.max(0, shown - 1));
  if (e.key === 'Enter') openSheet(shown);
});

const hintEl = $('#hint');
let hintGone = false;
function showHint() { if (!hintGone) hintEl.classList.add('on'); later(hideHint, 9000); }
function hideHint() { if (hintGone) return; hintGone = true; hintEl.classList.remove('on'); }

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
setSoup(0, true);
dotEls[0].classList.add('on');
layoutCards();
bowlGroup.position.y = 7;
renderer.setAnimationLoop(loop);

const go = () => {
  const tl = gsap.timeline();
  tl.to('#intro h1 span', { yPercent: -130, opacity: 0, stagger: .045, duration: .45, ease: 'power3.in' })
    .to('#intro p, #intro .steam', { opacity: 0, duration: .3 }, '<')
    .to('#intro', { clipPath: 'inset(0% 0% 100% 0%)', duration: .9, ease: 'expo.inOut' }, '-=.05')
    .add(() => $('#intro').remove())
    .to(bowlGroup.position, { y: 0, duration: 1.2, ease: 'bounce.out' }, '-=.75')
    .from('.top > *', { y: -50, opacity: 0, stagger: .1, duration: .8, ease: 'back.out(2)' }, '-=.9')
    .from('.cards', { y: 260, duration: 1.1, ease: 'expo.out' }, '<.1')
    .from('.dots', { opacity: 0, duration: .5 }, '<.4')
    .add(() => { rain(reduced ? 6 : 14); showHint(); }, '-=.9');
};
// laisse la police et le premier rendu arriver, mais n'attend jamais trop
Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]).then(() => setTimeout(go, 450));
</script>
